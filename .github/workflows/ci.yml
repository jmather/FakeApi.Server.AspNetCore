name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FakeApi.Server.AspNetCore.sln

      - name: Build
        run: dotnet build FakeApi.Server.AspNetCore.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FakeApi.Server.AspNetCore.sln --configuration Release --no-build

      - name: Check for vulnerable packages
        run: dotnet list FakeApi.Server.AspNetCore.sln package --vulnerable --include-transitive

      - name: Conformance
        run: dotnet run -c Release --project src/FakeApi.ConformanceRunner --no-build
